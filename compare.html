<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo vs Full · Side by Side</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#252d38;
    --ink:#e6edf3; --dim:#8b949e; --accent:#e85d26;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Segoe UI',-apple-system,'Microsoft YaHei',sans-serif;
    display:flex;flex-direction:column;
  }
  .bar{
    display:flex;align-items:center;gap:28px;flex-wrap:wrap;
    padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel);
  }
  .bar a{
    color:var(--dim);text-decoration:none;font-size:13.5px;
    font-family:ui-monospace,Consolas,monospace;
  }
  .bar a:hover{color:var(--accent)}
  .title{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .title span{color:var(--accent)}
  .specs{display:flex;gap:26px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}
  .specs b{color:var(--ink);font-family:ui-monospace,Consolas,monospace}
  .panes{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);min-height:0}
  .pane{display:flex;flex-direction:column;background:var(--bg);min-height:0}
  .pane h2{
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);font-weight:700;padding:10px 16px;
    border-bottom:1px solid var(--line);background:var(--panel);
  }
  .pane iframe{flex:1;width:100%;border:0;background:#fff}
  @media(max-width:900px){
    .panes{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
    .specs{display:none}
  }
</style>
</head>
<body>

<div class="bar">
  <div class="title">Same 120 g of rice, <span>two builds</span></div>
  <div class="specs">
    <div>demo <b>1 : 1.2</b></div>
    <div>full <b>8 presets</b></div>
    <div>lead <b>5 g</b></div>
    <div>sample <b>200 ms</b></div>
  </div>
  <div style="margin-left:auto;display:flex;gap:22px">
    <a href="index.html">← back</a>
    <a href="demo-sim.html">demo alone</a>
    <a href="full-sim.html">full alone</a>
  </div>
</div>

<div class="panes">
  <div class="pane">
    <h2>Demo build · classroom</h2>
    <iframe src="demo-sim.html" title="Demo simulator"></iframe>
  </div>
  <div class="pane">
    <h2>Full build · product</h2>
    <iframe src="full-sim.html" title="Full simulator"></iframe>
  </div>
</div>

</body>
</html>
